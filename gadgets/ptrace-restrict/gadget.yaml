name: ptrace-restrict
description: Restrict ptrace
homepageURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/ptrace-restrict
documentationURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/ptrace-restrict
sourceURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/ptrace-restrict
datasources:
  ptrace_restrict:
    fields:
      process:
        annotations:
          description: The process attempting to use ptrace
      timestamp_raw:
        annotations:
          description: Timestamp of the event
params:
  ebpf:
    enforce:
      key: enforce
      defaultValue: "true"
      description: Enforce the restriction (block) or just audit
    targ_comm:
      key: targ_comm
      defaultValue: ""
      description: Process name (comm)
    targ_gid:
      key: targ_gid
      defaultValue: ""
      description: Group ID
    targ_pid:
      key: targ_pid
      defaultValue: ""
      description: Process ID
    targ_tid:
      key: targ_tid
      defaultValue: ""
      description: Thread ID
    targ_uid:
      key: targ_uid
      defaultValue: ""
      description: User ID
